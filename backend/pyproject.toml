[project]
name = "ahi-va-mi-cafe"
version = "0.1.0"
description = "MVP de trazabilidad logistica, documental y ambiental del cafe colombiano"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "geoalchemy2>=0.15",
  "shapely>=2.0",
  "redis>=5.0",
  "rq>=1.16",
  "httpx>=0.27",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "openai>=1.40",
  "azure-storage-blob>=12.20",
  "pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["app"]
# ORM lookups return Optional values that are guaranteed by foreign keys; see README (Calidad).
disable_error_code = ["union-attr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
